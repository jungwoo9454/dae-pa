name: ✨ 기능 개발
description: 새 기능 또는 개선 작업을 등록합니다.
title: "[Feat] "
labels: ["✨ feat"]
body:
  - type: textarea
    id: description
    attributes:
      label: 📋 기능 설명
      description: 어떤 기능인지, 왜 필요한지 간단히 적어주세요.
      placeholder: 예) 공구 공고 작성 폼 — 카테고리 선택 + 실시간 카드 미리보기
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: ✅ 작업 목록
      description: 완료 조건을 체크박스로 쪼개주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 🗂 기능 영역
      options:
        - 공구 공고
        - 공구 목록·상세
        - 채팅
        - 정산
        - 대파페이(지갑)
        - 프로필/설정
        - 공통/인프라
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 🔥 우선순위
      options:
        - P0 — 없으면 데모 불가
        - P1 — 핵심 기능
        - P2 — 여유 있으면
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: ⏰ 목표일
      options:
        - Day 1 (08.10)
        - Day 2 (08.11)
        - Day 3 (08.12)
    validations:
      required: true
